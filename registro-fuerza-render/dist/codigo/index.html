<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Código del proyecto Grupo 14</title><style>body{font:15px Arial,sans-serif;margin:40px auto;max-width:1100px;padding:0 20px;color:#20251f;background:#f6f5ef}h1{font-size:32px}a{color:#a73919}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:24px;border:1px solid #ddd;border-radius:10px;font-size:12px}select{padding:10px;font:inherit}</style></head><body><a href="../">← Volver al prototipo</a><h1>Código del proyecto Grupo 14</h1><p>Consulta los archivos de esta versión. El enlace al repositorio GitHub se entrega junto al informe.</p><label>Archivo <select id="file"><option value="README.md">README.md</option><option value="package.json">package.json</option><option value="render.yaml">render.yaml</option><option value="dist/index.html">dist/index.html</option><option value="dist/style.css">dist/style.css</option><option value="dist/model.js">dist/model.js</option><option value="dist/app.js">dist/app.js</option><option value="tests/model.test.js">tests/model.test.js</option><option value="scripts/prepare-source.mjs">scripts/prepare-source.mjs</option></select></label><pre id="code" aria-live="polite">Cargando archivo…</pre><script>const select=document.querySelector('#file');async function show(){const code=document.querySelector('#code');try{const response=await fetch('archivos/'+select.value+'.txt');if(!response.ok)throw new Error();code.textContent=await response.text();}catch{code.textContent='No se pudo cargar el archivo. Intenta actualizar la página.';}}select.onchange=show;show();</script></body></html>
